# Memory-Enhanced Chatbot Configuration
# ======================================

chatbot:
  name: "Claude"
  personality: "helpful, knowledgeable, friendly"
  enable_learning: true

# Memory configuration
memory:
  # Working memory (Miller's Law: 7±2 items)
  working_capacity: 7

  # Episodic memory
  episodic_capacity: 100
  enable_consolidation: true
  consolidation_threshold: 0.6  # Min importance to consolidate

  # Memory decay
  decay_enabled: true
  decay_rate: 0.1  # Per day

  # Relevance scoring weights
  relevance_weights:
    importance: 0.4
    recency: 0.4
    frequency: 0.2

# Response generation (for future LLM integration)
response:
  max_length: 500
  temperature: 0.7
  use_memory_context: true
  max_context_items: 10

  # LLM providers (when implemented)
  llm:
    provider: "simulated"  # Options: simulated, openai, anthropic, local
    model: "gpt-3.5-turbo"
    api_key_env: "OPENAI_API_KEY"

# Persistence
persistence:
  auto_save: false
  save_interval_minutes: 5
  save_directory: "data/conversations"
  backup_enabled: false

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: false
  log_file: "chatbot.log"

# Performance
performance:
  enable_monitoring: false
  track_response_time: true
  track_memory_usage: false
